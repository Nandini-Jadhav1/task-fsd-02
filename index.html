<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Task List</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="task-app">
    <h1>My Task List</h1>

    <form id="form" class="task-form">
      <label for="text" class="task-label">Task</label>
      <div class="input-row">
        <input
          id="text"
          type="text"
          maxlength="200"
          placeholder="Enter a new task..."
          autocomplete="off"
        >
        <button type="submit" class="add-btn">Add</button>
      </div>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <ul id="list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add a task above to get started!</p>
  </main>
</body>
</html>
